# Configurazione per demo locale: porte pubblicate solo su 127.0.0.1.
# Base fedele al progetto originale, con esposizione di rete limitata e token Jupyter abilitato.
services:
  # --- 1. ZOOKEEPER ---
  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    environment:
      ZOO_MY_ID: 1
    ports:
      - "127.0.0.1:2181:2181"

  # --- 2. KAFKA ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- 3. SPARK MASTER ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data

  # --- 4. SPARK WORKER ---
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data

  # --- 5. JUPYTER LAB (Costruisce l'immagine una volta sola) ---
  jupyter-spark:
    build: .
    image: mio-progetto-tennis
    container_name: jupyter-lab
    command: start-notebook.sh
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      SPARK_MASTER: spark://spark-master:7077
    working_dir: /app
    depends_on:
      - spark-master
      - kafka
      - mongo

  # --- 6. DASHBOARD ---
  dashboard:
    build: .
    image: mio-progetto-tennis
    container_name: tennis-dashboard
    command: streamlit run /app/scripts/app.py --server.address 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      SPARK_MASTER: spark://spark-master:7077
    working_dir: /app
    depends_on:
      - jupyter-spark
      - spark-master
      - kafka
      - mongo

  # --- 7. MONGODB ---
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- 8. MONGO EXPRESS ---
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: always
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
    depends_on:
      - mongo

volumes:
  mongo_data:
